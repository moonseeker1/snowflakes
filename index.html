<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪花生成器 | Snowflake Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 30%, #283593 60%, #3949ab 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }

        /* 背景雪花动画 */
        .background-snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* 控制面板 */
        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .control-panel::-webkit-scrollbar {
            width: 6px;
        }

        .control-panel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .control-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(135deg, #fff, #90caf9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
        }

        /* 雪花类型选择 */
        .type-selector {
            margin-bottom: 25px;
        }

        .type-selector h3 {
            font-size: 14px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .type-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .type-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            text-align: center;
        }

        .type-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .type-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        /* 参数控制 */
        .parameter-group {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .parameter-group h3 {
            font-size: 14px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.8);
        }

        .parameter {
            margin-bottom: 18px;
        }

        .parameter:last-child {
            margin-bottom: 0;
        }

        .parameter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .parameter label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .parameter-value {
            font-size: 12px;
            color: #90caf9;
            background: rgba(144, 202, 249, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 滑块样式 */
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.5);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
        }

        /* 颜色选择器 */
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }

        /* 按钮 */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-glow {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(240, 147, 251, 0.5);
        }

        /* 画布区域 */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #snowflakeCanvas {
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 20px;
        }

        /* 状态信息 */
        .status-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式设计 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column-reverse;
                padding: 10px;
            }

            .control-panel {
                width: 100%;
                max-height: none;
            }

            #snowflakeCanvas {
                max-width: 100%;
                height: auto;
            }
        }

        /* 动画开关 */
        .animation-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 26px;
        }

        .toggle-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* 随机生成按钮 */
        .random-btn {
            width: 100%;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .random-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
    </style>
</head>
<body>
    <canvas class="background-snow" id="bgSnow"></canvas>

    <div class="container">
        <div class="control-panel">
            <h1>❄️ 雪花生成器</h1>
            <p class="subtitle">Snowflake Generator</p>

            <div class="type-selector">
                <h3>雪花类型</h3>
                <div class="type-buttons">
                    <button class="type-btn active" data-type="classic">经典</button>
                    <button class="type-btn" data-type="dendritic">树枝状</button>
                    <button class="type-btn" data-type="plate">板状</button>
                    <button class="type-btn" data-type="needle">针状</button>
                    <button class="type-btn" data-type="stellar">星状</button>
                    <button class="type-btn" data-type="fern">蕨叶状</button>
                    <button class="type-btn" data-type="crystal">晶体状</button>
                    <button class="type-btn" data-type="complex">复杂型</button>
                </div>
            </div>

            <div class="animation-toggle">
                <div class="toggle-switch active" id="animToggle"></div>
                <span class="toggle-label">旋转动画</span>
            </div>

            <div class="parameter-group">
                <h3>形状参数</h3>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>大小</label>
                        <span class="parameter-value" id="sizeValue">200</span>
                    </div>
                    <input type="range" id="size" min="100" max="350" value="200">
                </div>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>分支数量</label>
                        <span class="parameter-value" id="branchesValue">6</span>
                    </div>
                    <input type="range" id="branches" min="3" max="12" value="6">
                </div>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>复杂度</label>
                        <span class="parameter-value" id="complexityValue">5</span>
                    </div>
                    <input type="range" id="complexity" min="1" max="8" value="5">
                </div>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>厚度</label>
                        <span class="parameter-value" id="thicknessValue">2</span>
                    </div>
                    <input type="range" id="thickness" min="1" max="5" value="2">
                </div>
            </div>

            <div class="parameter-group">
                <h3>颜色主题</h3>
                <div class="color-picker">
                    <div class="color-option active" style="background: linear-gradient(135deg, #ffffff, #90caf9);" data-color="blue"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #ffffff, #ce93d8);" data-color="purple"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #ffffff, #a5d6a7);" data-color="green"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #ffffff, #ffcc80);" data-color="orange"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #ffffff, #ef9a9a);" data-color="red"></div>
                    <div class="color-option" style="background: linear-gradient(135deg, #ffffff, #e0e0e0);" data-color="white"></div>
                </div>
            </div>

            <div class="parameter-group">
                <h3>动画参数</h3>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>旋转速度</label>
                        <span class="parameter-value" id="speedValue">1.0</span>
                    </div>
                    <input type="range" id="speed" min="0" max="3" step="0.1" value="1">
                </div>
                <div class="parameter">
                    <div class="parameter-header">
                        <label>发光强度</label>
                        <span class="parameter-value" id="glowValue">15</span>
                    </div>
                    <input type="range" id="glow" min="0" max="30" value="15">
                </div>
            </div>

            <button class="random-btn" id="randomBtn">🎲 随机生成</button>

            <div class="button-group">
                <button class="btn btn-secondary" id="resetBtn">重置</button>
                <button class="btn btn-primary" id="saveBtn">保存图片</button>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="snowflakeCanvas" width="700" height="700"></canvas>
        </div>
    </div>

    <div class="status-info" id="statusInfo">
        当前: 经典雪花 | 分支: 6 | 复杂度: 5
    </div>

    <script>
        // 背景雪花动画
        const bgSnow = document.getElementById('bgSnow');
        const bgCtx = bgSnow.getContext('2d');
        bgSnow.width = window.innerWidth;
        bgSnow.height = window.innerHeight;

        class BackgroundSnowflake {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * bgSnow.width;
                this.y = -10;
                this.size = Math.random() * 4 + 1;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;

                if (this.y > bgSnow.height) {
                    this.reset();
                }
            }

            draw() {
                bgCtx.save();
                bgCtx.translate(this.x, this.y);
                bgCtx.rotate(this.rotation);
                bgCtx.globalAlpha = this.opacity;
                bgCtx.fillStyle = 'white';

                // 绘制简单的雪花
                for (let i = 0; i < 6; i++) {
                    bgCtx.rotate(Math.PI / 3);
                    bgCtx.beginPath();
                    bgCtx.moveTo(0, 0);
                    bgCtx.lineTo(0, this.size);
                    bgCtx.stroke();
                }

                bgCtx.restore();
            }
        }

        const bgSnowflakes = Array.from({ length: 100 }, () => new BackgroundSnowflake());

        function animateBackground() {
            bgCtx.clearRect(0, 0, bgSnow.width, bgSnow.height);
            bgSnowflakes.forEach(snowflake => {
                snowflake.update();
                snowflake.draw();
            });
            requestAnimationFrame(animateBackground);
        }

        // 主雪花生成器
        const canvas = document.getElementById('snowflakeCanvas');
        const ctx = canvas.getContext('2d');

        // 参数状态
        const state = {
            type: 'classic',
            size: 200,
            branches: 6,
            complexity: 5,
            thickness: 2,
            colorTheme: 'blue',
            animationEnabled: true,
            rotationSpeed: 1,
            glow: 15,
            currentRotation: 0
        };

        // 颜色主题
        const colorThemes = {
            blue: { primary: '#ffffff', secondary: '#90caf9', tertiary: '#64b5f6' },
            purple: { primary: '#ffffff', secondary: '#ce93d8', tertiary: '#ba68c8' },
            green: { primary: '#ffffff', secondary: '#a5d6a7', tertiary: '#81c784' },
            orange: { primary: '#ffffff', secondary: '#ffcc80', tertiary: '#ffb74d' },
            red: { primary: '#ffffff', secondary: '#ef9a9a', tertiary: '#e57373' },
            white: { primary: '#ffffff', secondary: '#e0e0e0', tertiary: '#bdbdbd' }
        };

        // 雪花生成算法
        const snowflakeGenerators = {
            classic: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    const baseAngle = b * angleStep;
                    ctx.save();
                    ctx.rotate(baseAngle);

                    // 主分支
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -size);
                    ctx.strokeStyle = params.colors.primary;
                    ctx.lineWidth = thickness;
                    ctx.stroke();

                    // 侧分支
                    for (let i = 1; i <= complexity; i++) {
                        const dist = (size / complexity) * i;
                        const branchSize = (size * 0.3) / (i * 0.5);

                        // 两侧分支
                        for (let side of [-1, 1]) {
                            ctx.beginPath();
                            ctx.moveTo(0, -dist);
                            const sideX = Math.cos(side * Math.PI / 6) * branchSize;
                            const sideY = -dist - Math.abs(Math.sin(side * Math.PI / 6)) * branchSize;
                            ctx.lineTo(sideX, sideY);
                            ctx.strokeStyle = params.colors.secondary;
                            ctx.lineWidth = thickness * 0.7;
                            ctx.stroke();

                            // 更小的分支
                            if (complexity > 3) {
                                ctx.beginPath();
                                ctx.moveTo(0, -dist);
                                const miniX = Math.cos(side * Math.PI / 12) * branchSize * 0.6;
                                const miniY = -dist - Math.abs(Math.sin(side * Math.PI / 12)) * branchSize * 0.6;
                                ctx.lineTo(miniX, miniY);
                                ctx.strokeStyle = params.colors.tertiary;
                                ctx.lineWidth = thickness * 0.5;
                                ctx.stroke();
                            }
                        }
                    }

                    ctx.restore();
                }
            },

            dendritic: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    ctx.save();
                    ctx.rotate(b * angleStep);
                    drawDendriticBranch(ctx, 0, -size, complexity, thickness, params.colors);
                    ctx.restore();
                }
            },

            plate: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    const baseAngle = b * angleStep;
                    ctx.save();
                    ctx.rotate(baseAngle);

                    // 六边形板
                    ctx.beginPath();
                    for (let i = 0; i <= 6; i++) {
                        const angle = (i * Math.PI) / 3;
                        const x = Math.cos(angle) * size * 0.8;
                        const y = Math.sin(angle) * size * 0.8;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = params.colors.primary;
                    ctx.lineWidth = thickness;
                    ctx.stroke();

                    // 内部装饰
                    const layers = Math.min(complexity, 4);
                    for (let l = 1; l <= layers; l++) {
                        const layerSize = size * 0.8 * (1 - l * 0.2);
                        ctx.beginPath();
                        for (let i = 0; i <= 6; i++) {
                            const angle = (i * Math.PI) / 3 + Math.PI / 6;
                            const x = Math.cos(angle) * layerSize;
                            const y = Math.sin(angle) * layerSize;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.strokeStyle = l % 2 === 1 ? params.colors.secondary : params.colors.tertiary;
                        ctx.lineWidth = thickness * 0.6;
                        ctx.stroke();
                    }

                    ctx.restore();
                }
            },

            needle: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    ctx.save();
                    ctx.rotate(b * angleStep);

                    // 主针
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -size);
                    ctx.strokeStyle = params.colors.primary;
                    ctx.lineWidth = thickness * 1.5;
                    ctx.stroke();

                    // 细侧针
                    for (let i = 1; i <= complexity; i++) {
                        const dist = (size / complexity) * i;
                        for (let side of [-1, 1]) {
                            ctx.beginPath();
                            ctx.moveTo(0, -dist);
                            ctx.lineTo(side * size * 0.15, -dist - size * 0.1);
                            ctx.strokeStyle = params.colors.secondary;
                            ctx.lineWidth = thickness * 0.5;
                            ctx.stroke();
                        }
                    }

                    ctx.restore();
                }
            },

            stellar: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    ctx.save();
                    ctx.rotate(b * angleStep);

                    // 星形
                    ctx.beginPath();
                    for (let i = 0; i <= branches * 2; i++) {
                        const angle = (i * Math.PI) / branches;
                        const r = i % 2 === 0 ? size : size * 0.4;
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = params.colors.primary;
                    ctx.lineWidth = thickness;
                    ctx.stroke();

                    // 内层星
                    ctx.beginPath();
                    for (let i = 0; i <= branches * 2; i++) {
                        const angle = (i * Math.PI) / branches + Math.PI / branches;
                        const r = i % 2 === 0 ? size * 0.5 : size * 0.25;
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = params.colors.tertiary;
                    ctx.lineWidth = thickness * 0.7;
                    ctx.stroke();

                    ctx.restore();
                }
            },

            fern: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    ctx.save();
                    ctx.rotate(b * angleStep);

                    // 主轴
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -size);
                    ctx.strokeStyle = params.colors.primary;
                    ctx.lineWidth = thickness;
                    ctx.stroke();

                    // 蕨叶
                    for (let i = 1; i <= complexity; i++) {
                        const dist = (size / complexity) * i;
                        for (let side of [-1, 1]) {
                            ctx.beginPath();
                            ctx.moveTo(0, -dist);
                            const leafAngle = side * Math.PI / 4;
                            const leafSize = (size * 0.3) / (i * 0.4);
                            ctx.lineTo(Math.sin(leafAngle) * leafSize, -dist - Math.cos(leafAngle) * leafSize);
                            ctx.strokeStyle = i % 2 === 0 ? params.colors.secondary : params.colors.tertiary;
                            ctx.lineWidth = thickness * 0.6;
                            ctx.stroke();
                        }
                    }

                    ctx.restore();
                }
            },

            crystal: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;

                // 外层晶体
                ctx.beginPath();
                for (let i = 0; i <= 12; i++) {
                    const angle = (i * Math.PI) / 6;
                    const r = i % 2 === 0 ? size : size * 0.6;
                    const x = Math.cos(angle) * r;
                    const y = Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = params.colors.primary;
                ctx.lineWidth = thickness;
                ctx.stroke();

                // 内层结构
                const layers = Math.min(complexity, 3);
                for (let l = 1; l <= layers; l++) {
                    const layerSize = size * (0.4 + l * 0.15);
                    ctx.beginPath();
                    for (let i = 0; i <= 12; i++) {
                        const angle = (i * Math.PI) / 6 + Math.PI / 12;
                        const r = i % 2 === 0 ? layerSize : layerSize * 0.7;
                        const x = Math.cos(angle) * r;
                        const y = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.strokeStyle = l === 1 ? params.colors.secondary : params.colors.tertiary;
                    ctx.lineWidth = thickness * 0.6;
                    ctx.stroke();
                }

                // 对角线
                for (let i = 0; i < 6; i++) {
                    const angle = i * Math.PI / 3;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle) * size * 0.6, Math.sin(angle) * size * 0.6);
                    ctx.lineTo(Math.cos(angle + Math.PI) * size * 0.6, Math.sin(angle + Math.PI) * size * 0.6);
                    ctx.strokeStyle = params.colors.tertiary;
                    ctx.lineWidth = thickness * 0.5;
                    ctx.stroke();
                }
            },

            complex: (ctx, params) => {
                const { size, branches, complexity, thickness } = params;
                const angleStep = (Math.PI * 2) / branches;

                for (let b = 0; b < branches; b++) {
                    const baseAngle = b * angleStep;
                    ctx.save();
                    ctx.rotate(baseAngle);

                    // 复杂的主分支
                    drawComplexBranch(ctx, 0, -size, complexity, thickness, params.colors);

                    ctx.restore();
                }

                // 中心装饰
                for (let ring = 1; ring <= 3; ring++) {
                    ctx.beginPath();
                    ctx.arc(0, 0, size * 0.15 * ring, 0, Math.PI * 2);
                    ctx.strokeStyle = ring === 2 ? params.colors.secondary : params.colors.tertiary;
                    ctx.lineWidth = thickness * 0.5;
                    ctx.stroke();
                }
            }
        };

        function drawDendriticBranch(ctx, x, y, depth, thickness, colors, length = null) {
            if (depth <= 0) return;

            if (length === null) {
                length = -y;
            }

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, y);
            ctx.strokeStyle = colors.primary;
            ctx.lineWidth = thickness;
            ctx.stroke();

            const newLength = Math.abs(length) * 0.7;
            const newThickness = thickness * 0.7;

            if (depth > 1) {
                // 左分支
                ctx.save();
                ctx.translate(0, y);
                ctx.rotate(-Math.PI / 7);
                drawDendriticBranch(ctx, 0, -newLength, depth - 1, newThickness, colors, newLength);
                ctx.restore();

                // 右分支
                ctx.save();
                ctx.translate(0, y);
                ctx.rotate(Math.PI / 7);
                drawDendriticBranch(ctx, 0, -newLength, depth - 1, newThickness, colors, newLength);
                ctx.restore();

                // 中间小分支
                if (depth > 2) {
                    ctx.save();
                    ctx.translate(0, y * 0.5);
                    ctx.rotate(-Math.PI / 14);
                    drawDendriticBranch(ctx, 0, -newLength * 0.5, depth - 2, newThickness * 0.5, colors, newLength * 0.5);
                    ctx.restore();

                    ctx.save();
                    ctx.translate(0, y * 0.5);
                    ctx.rotate(Math.PI / 14);
                    drawDendriticBranch(ctx, 0, -newLength * 0.5, depth - 2, newThickness * 0.5, colors, newLength * 0.5);
                    ctx.restore();
                }
            }
        }

        function drawComplexBranch(ctx, x, y, complexity, thickness, colors) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, y);
            ctx.strokeStyle = colors.primary;
            ctx.lineWidth = thickness;
            ctx.stroke();

            const segments = complexity;
            for (let i = 1; i <= segments; i++) {
                const dist = (y / segments) * i;

                // 主侧分支
                for (let side of [-1, 1]) {
                    ctx.save();
                    ctx.translate(0, dist);
                    ctx.rotate(side * Math.PI / 5);

                    const branchLength = Math.abs(y) * 0.25;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, -branchLength);
                    ctx.strokeStyle = colors.secondary;
                    ctx.lineWidth = thickness * 0.7;
                    ctx.stroke();

                    // 次级分支
                    if (i > 1) {
                        for (let subSide of [-1, 1]) {
                            ctx.save();
                            ctx.rotate(subSide * Math.PI / 6);
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(0, -branchLength * 0.5);
                            ctx.strokeStyle = colors.tertiary;
                            ctx.lineWidth = thickness * 0.5;
                            ctx.stroke();
                            ctx.restore();
                        }
                    }

                    ctx.restore();
                }
            }
        }

        function drawSnowflake() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(state.currentRotation);

            // 设置发光效果
            ctx.shadowColor = colorThemes[state.colorTheme].secondary;
            ctx.shadowBlur = state.glow;

            // 生成雪花
            const generator = snowflakeGenerators[state.type];
            if (generator) {
                generator(ctx, {
                    size: state.size,
                    branches: state.branches,
                    complexity: state.complexity,
                    thickness: state.thickness,
                    colors: colorThemes[state.colorTheme]
                });
            }

            ctx.restore();

            // 更新状态信息
            updateStatusInfo();
        }

        function animate() {
            if (state.animationEnabled) {
                state.currentRotation += 0.005 * state.rotationSpeed;
            }
            drawSnowflake();
            requestAnimationFrame(animate);
        }

        function updateStatusInfo() {
            const typeNames = {
                classic: '经典',
                dendritic: '树枝状',
                plate: '板状',
                needle: '针状',
                stellar: '星状',
                fern: '蕨叶状',
                crystal: '晶体状',
                complex: '复杂型'
            };
            const colorNames = {
                blue: '蓝色', purple: '紫色', green: '绿色',
                orange: '橙色', red: '红色', white: '白色'
            };
            document.getElementById('statusInfo').textContent =
                `${typeNames[state.type]} | 分支: ${state.branches} | 复杂度: ${state.complexity} | ${colorNames[state.colorTheme]}`;
        }

        // 事件绑定
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.type = btn.dataset.type;
            });
        });

        document.querySelectorAll('.color-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
                option.classList.add('active');
                state.colorTheme = option.dataset.color;
            });
        });

        // 参数滑块
        const params = ['size', 'branches', 'complexity', 'thickness', 'speed', 'glow'];
        params.forEach(param => {
            const slider = document.getElementById(param);
            const valueDisplay = document.getElementById(param + 'Value');

            if (slider && valueDisplay) {
                slider.addEventListener('input', (e) => {
                    const value = parseFloat(e.target.value);
                    valueDisplay.textContent = value;

                    if (param === 'speed') {
                        state.rotationSpeed = value;
                    } else if (param === 'glow') {
                        state.glow = value;
                    } else {
                        state[param] = value;
                    }
                });
            }
        });

        // 动画开关
        const animToggle = document.getElementById('animToggle');
        animToggle.addEventListener('click', () => {
            animToggle.classList.toggle('active');
            state.animationEnabled = animToggle.classList.contains('active');
        });

        // 随机生成
        document.getElementById('randomBtn').addEventListener('click', () => {
            const types = Object.keys(snowflakeGenerators);
            const colors = Object.keys(colorThemes);

            state.type = types[Math.floor(Math.random() * types.length)];
            state.size = 150 + Math.random() * 150;
            state.branches = 3 + Math.floor(Math.random() * 6);
            state.complexity = 2 + Math.floor(Math.random() * 5);
            state.thickness = 1 + Math.floor(Math.random() * 3);
            state.colorTheme = colors[Math.floor(Math.random() * colors.length)];
            state.rotationSpeed = 0.3 + Math.random() * 2;
            state.glow = 5 + Math.random() * 20;

            // 更新UI
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === state.type);
            });
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.color === state.colorTheme);
            });

            document.getElementById('size').value = state.size;
            document.getElementById('sizeValue').textContent = Math.round(state.size);
            document.getElementById('branches').value = state.branches;
            document.getElementById('branchesValue').textContent = state.branches;
            document.getElementById('complexity').value = state.complexity;
            document.getElementById('complexityValue').textContent = state.complexity;
            document.getElementById('thickness').value = state.thickness;
            document.getElementById('thicknessValue').textContent = state.thickness;
            document.getElementById('speed').value = state.rotationSpeed;
            document.getElementById('speedValue').textContent = state.rotationSpeed.toFixed(1);
            document.getElementById('glow').value = state.glow;
            document.getElementById('glowValue').textContent = Math.round(state.glow);
        });

        // 重置
        document.getElementById('resetBtn').addEventListener('click', () => {
            state.type = 'classic';
            state.size = 200;
            state.branches = 6;
            state.complexity = 5;
            state.thickness = 2;
            state.colorTheme = 'blue';
            state.rotationSpeed = 1;
            state.glow = 15;

            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === 'classic');
            });
            document.querySelectorAll('.color-option').forEach(opt => {
                opt.classList.toggle('active', opt.dataset.color === 'blue');
            });

            document.getElementById('size').value = 200;
            document.getElementById('sizeValue').textContent = '200';
            document.getElementById('branches').value = 6;
            document.getElementById('branchesValue').textContent = '6';
            document.getElementById('complexity').value = 5;
            document.getElementById('complexityValue').textContent = '5';
            document.getElementById('thickness').value = 2;
            document.getElementById('thicknessValue').textContent = '2';
            document.getElementById('speed').value = 1;
            document.getElementById('speedValue').textContent = '1.0';
            document.getElementById('glow').value = 15;
            document.getElementById('glowValue').textContent = '15';
        });

        // 保存图片
        document.getElementById('saveBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `snowflake_${state.type}_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // 窗口大小改变
        window.addEventListener('resize', () => {
            bgSnow.width = window.innerWidth;
            bgSnow.height = window.innerHeight;
        });

        // 初始化
        animateBackground();
        animate();
    </script>
</body>
</html>
